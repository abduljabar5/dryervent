name = "twin-cities-dryer-vent"
compatibility_date = "2026-10-01"
pages_build_output_dir = "."

# KV namespace for bookings + contact messages. Create with:
#   npx wrangler kv namespace create BOOKINGS
# then paste the id below.
[[kv_namespaces]]
binding = "BOOKINGS"
id = "REPLACE_WITH_KV_ID"

[vars]
BRAND_NAME = "Twin Cities Dryer Vent Pros"
BRAND_PHONE = "(612) 555-0147"
SITE_URL = "https://twin-cities-dryer-vent.pages.dev"
